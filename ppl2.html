<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="theme-color" content="#0d0d0d">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<link rel="manifest" href="/Workout/manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="/Workout/icon-180.png">
<title>Workout</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d0d;--bg2:#111;--bg3:#141414;--bg4:#1a1a1a;
  --border:#1e1e1e;--border2:#222;
  --text:#f0f0f0;--text2:#888;--text3:#444;
  --green:#4ade80;--green-dim:#1a2e1a;--green-bg:#0d1a0d;
  --orange:#f97316;--orange-dim:#2a1a0d;
  --red:#f87171;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden}

/* ONBOARDING */
#onboard{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px 24px;gap:20px}
.ob-logo{font-size:56px;margin-bottom:8px}
.ob-title{font-size:28px;font-weight:600;color:var(--text);text-align:center}
.ob-sub{font-size:15px;color:var(--text2);text-align:center;line-height:1.5}
.ob-input{width:100%;max-width:340px;background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:14px 16px;font-size:16px;color:var(--text);outline:none}
.ob-input:focus{border-color:var(--green)}
.ob-btn{width:100%;max-width:340px;background:var(--green);color:#0a1a0a;border:none;border-radius:12px;padding:16px;font-size:16px;font-weight:600;cursor:pointer}

/* MAIN APP */
#app{display:none;flex-direction:column;min-height:100vh}

/* HEADER */
.hdr{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between}
.hdr-left{}
.day-lbl{font-size:11px;font-weight:500;color:var(--text3);letter-spacing:0.12em;text-transform:uppercase}
.day-title{font-size:22px;font-weight:600;color:var(--text);line-height:1.2;margin-top:2px}
.week-badge{font-size:11px;font-weight:600;background:var(--green-dim);color:var(--green);padding:5px 10px;border-radius:20px;letter-spacing:0.06em;margin-top:4px;white-space:nowrap}

/* TIMER */
.timer-bar{background:var(--bg2);padding:12px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.timer-num{font-size:34px;font-weight:600;color:var(--green);font-variant-numeric:tabular-nums;letter-spacing:-0.02em;min-width:72px}
.timer-num.urgent{color:var(--red)}
.t-presets{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}
.t-pre{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap;flex-shrink:0}
.t-pre.on{border-color:var(--green);color:var(--green)}
.t-btns{display:flex;gap:8px;flex-shrink:0}
.t-start{background:var(--green);color:#0a1a0a;border:none;border-radius:10px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.t-reset{background:var(--bg3);color:var(--text2);border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer}

/* DAY TABS */
.day-tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);scrollbar-width:none;padding:0 12px;gap:2px}
.day-tab{padding:10px 12px;font-size:11px;font-weight:500;color:var(--text3);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;flex-shrink:0;text-align:center;line-height:1.3}
.day-tab.on{color:var(--green);border-bottom:2px solid var(--green)}
.day-tab .dt-sub{font-size:10px;opacity:0.7;display:block;margin-top:1px}

/* CONTENT */
.content{flex:1;padding:0 0 100px}

/* SECTION LABEL */
.sec-lbl{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:0.14em;text-transform:uppercase;padding:18px 20px 8px}

/* GIANT BADGE */
.giant-badge{margin:4px 16px 8px;display:flex;align-items:flex-start;gap:8px}
.giant-dot{width:8px;height:8px;border-radius:2px;background:var(--orange);flex-shrink:0;margin-top:3px}
.giant-lbl{font-size:10px;color:var(--orange);font-weight:600;letter-spacing:0.06em;text-transform:uppercase;line-height:1.4}

/* ABS BADGE */
.abs-badge{margin:4px 16px 8px;display:flex;align-items:flex-start;gap:8px}
.abs-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;margin-top:3px}
.abs-lbl{font-size:10px;color:var(--green);font-weight:600;letter-spacing:0.06em;text-transform:uppercase;line-height:1.4}

/* EXERCISE CARD */
.ex-card{margin:0 16px 10px;background:var(--bg3);border-radius:14px;border:1px solid var(--border);overflow:hidden}
.ex-card.giant-card{background:#111a11;border-color:#1e2a1e}
.ex-card.abs-card{background:var(--bg3);border-color:var(--border)}
.ex-card.done-card{opacity:0.6}

/* CARD HEADER */
.ex-hdr{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ex-name{font-size:16px;font-weight:600;color:var(--text);line-height:1.3}
.ex-focus{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.4}
.ex-ring{display:flex;align-items:center;gap:5px;flex-shrink:0}
.ring-lbl{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums}

/* SET ROWS */
.warmup-row{display:grid;grid-template-columns:60px 1fr auto 40px;align-items:center;padding:8px 16px;border-top:1px solid var(--border);gap:8px;opacity:0.4}
.set-row{display:grid;grid-template-columns:60px 1fr auto 40px;align-items:center;padding:10px 16px;border-top:1px solid var(--border);gap:8px;cursor:pointer;transition:background 0.15s}
.set-row:active{background:var(--bg4)}
.set-row.set-done{background:var(--green-bg)}
.set-lbl{font-size:12px;font-weight:600;color:var(--text3);letter-spacing:0.04em}
.set-kg{font-size:20px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;line-height:1}
.set-kg-unit{font-size:12px;font-weight:400;color:var(--text2);margin-left:2px}
.set-reps{font-size:14px;color:var(--text2);font-variant-numeric:tabular-nums;text-align:right}
.set-tick{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border2);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s}
.set-tick.ticked{background:var(--green);border-color:var(--green)}
.set-tick.ticked::after{content:'✓';font-size:14px;color:#0a1a0a;font-weight:700}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);padding:12px 20px 28px;display:flex;gap:12px}
.finish-btn{flex:1;background:var(--green);color:#0a1a0a;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:600;cursor:pointer}
.sync-btn{background:var(--bg3);color:var(--text2);border:1px solid var(--border);border-radius:12px;padding:14px 18px;font-size:14px;cursor:pointer;white-space:nowrap}

/* REST DAY */
#rest{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;padding:40px 24px;text-align:center;gap:16px}
.rest-icon{font-size:64px}
.rest-title{font-size:28px;font-weight:600;color:var(--text)}
.rest-msg{font-size:15px;color:var(--text2);line-height:1.6;max-width:320px}

/* SETTINGS */
.settings-btn{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:4px}
</style>
</head>
<body>

<!-- ONBOARDING -->
<div id="onboard">
  <div class="ob-logo">💪</div>
  <div class="ob-title">Welcome</div>
  <div class="ob-sub">Your personal workout tracker</div>
  <input class="ob-input" id="ob-name" type="text" placeholder="Your name" maxlength="30">
  <button class="ob-btn" onclick="completeOnboard()">Let's go</button>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="hdr">
    <div class="hdr-left">
      <div class="day-lbl" id="hdr-date">Monday</div>
      <div class="day-title" id="hdr-title">Push 1 — Heavy</div>
      <div class="week-badge" id="week-badge">Week A</div>
    </div>
    <button class="settings-btn" onclick="showSettings()">⚙</button>
  </div>

  <div class="timer-bar">
    <div class="timer-num" id="t-dig">2:30</div>
    <div class="t-presets">
      <div class="t-pre" onclick="setTimer(150)">2:30</div>
      <div class="t-pre" onclick="setTimer(120)">2:00</div>
      <div class="t-pre" onclick="setTimer(90)">1:30</div>
      <div class="t-pre" onclick="setTimer(60)">1:00</div>
      <div class="t-pre" onclick="setTimer(45)">0:45</div>
    </div>
    <div class="t-btns">
      <button class="t-reset" onclick="resetTimer()">Reset</button>
      <button class="t-start" id="t-start" onclick="toggleTimer()">▶ Start</button>
    </div>
  </div>

  <div class="day-tabs" id="day-tabs"></div>

  <div class="content" id="content">
    <div id="rest" style="display:none">
      <div class="rest-icon">🛌</div>
      <div class="rest-title">Rest Day</div>
      <div class="rest-msg" id="rest-msg">Muscles grow when you recover.</div>
    </div>
    <div id="exwrap"></div>
  </div>

  <div class="bottom-nav">
    <button class="finish-btn" onclick="finishDay()">✓ Finish Workout</button>
    <button class="sync-btn" onclick="syncSheets()">☁ Sync</button>
  </div>
</div>

<script>
const P=[{"id":"d1","label":"Day 1","title":"Push 1 \u2014 Heavy","muscle":"Chest, Shoulders, Triceps","note":"Heavy compounds first \u2014 full rest. Giant set is continuous no rest between exercises.","a":{"label":"Week A","exercises":[{"id":"d1a_inc_bp","giant":false,"giantLabel":"","name":"Incline Barbell Press","focus":"Upper chest \u2014 primary heavy compound","rest":180,"sets":[{"t":"Warm-up","kg":40,"r":15},{"t":"Set 1","kg":70,"r":7},{"t":"Set 2","kg":70,"r":7},{"t":"Set 3","kg":67.5,"r":7},{"t":"Set 4","kg":65,"r":8}],"form":"Bench at 30\u00b0. Retract scapula. Bar to upper chest. Elbows 45\u00b0. Drive up and slightly back.","pre":"Squeeze shoulder blades, push chest up, big breath and brace.","during":"Upper chest stretch at bottom. Contraction at top \u2014 not front delt.","check":"Correct: upper chest stretch. Wrong: front delt \u2014 lower the bench angle."},{"id":"d1a_ohp","giant":false,"giantLabel":"","name":"Overhead Barbell Press","focus":"All 3 delt heads \u2014 heavy compound","rest":180,"sets":[{"t":"Warm-up","kg":30,"r":15},{"t":"Set 1","kg":50,"r":7},{"t":"Set 2","kg":50,"r":7},{"t":"Set 3","kg":47.5,"r":7},{"t":"Set 4","kg":47.5,"r":8}],"form":"Bar at collarbone. Press up and slightly back. Full lockout with slight shrug. Brace core.","pre":"Touch all three parts of your shoulder \u2014 all three fire here.","during":"Press the ceiling away. Full shoulder cap contracted at lockout.","check":"Correct: whole shoulder cap burning. Wrong: only front delt \u2014 elbows too far forward."},{"id":"d1a_cable_lth","giant":true,"giantLabel":"Giant Set \u2014 no rest between: Cable Cross \u2192 Lateral Raise \u2192 Overhead Cable Ext \u2192 Rope Pushdown \u2192 Rear Delt Fly \u2014 rest 90 sec after all 5","name":"Cable Crossover (Low-to-High)","focus":"Upper chest \u2014 cable stretch","rest":0,"sets":[{"t":"Round 1","kg":10,"r":12},{"t":"Round 2","kg":10,"r":12}],"form":"Cables at lowest. Stand centre, slight forward lean. Hands from hip level UP to chest height. Squeeze hard at top.","pre":"Cable at bottom creates upward pull targeting upper pec fibres specifically.","during":"Feel upward arc in upper chest. Squeeze hard at the top for 1 sec.","check":"Correct: burning near collarbone at squeeze. Wrong: shoulders firing \u2014 hands going too high."},{"id":"d1a_lat_raise","giant":true,"giantLabel":"","name":"Lateral Raise","focus":"Side delt \u2014 isolation","rest":0,"sets":[{"t":"Round 1","kg":10,"r":15},{"t":"Round 2","kg":8,"r":20}],"form":"Slight forward lean. Elbow leads. Raise to shoulder height. 3 sec lowering.","pre":"3-second lowering is where side delt works hardest.","during":"Feel outer shoulder burning on the way DOWN especially.","check":"Correct: outer shoulder burning. Wrong: traps shrugging \u2014 reduce weight."},{"id":"d1a_overhead_ext","giant":true,"giantLabel":"","name":"Overhead Cable Extension","focus":"Tricep long head \u2014 only stretches overhead","rest":0,"sets":[{"t":"Round 1","kg":35,"r":12},{"t":"Round 2","kg":32.5,"r":12}],"form":"Face away from cable. Rope overhead. Hands drop as far back as possible. Elbows forward and fixed. Press to extension.","pre":"Long head only fully stretches in this overhead position.","during":"Hold the stretch 1 sec before pressing. That stretch is the stimulus.","check":"Correct: deep stretch in back of upper arm. Wrong: elbows flaring \u2014 must stay forward."},{"id":"d1a_rope_push","giant":true,"giantLabel":"","name":"Rope Pushdown","focus":"Tricep lateral head \u2014 outer visible head","rest":0,"sets":[{"t":"Round 1","kg":52.5,"r":12},{"t":"Round 2","kg":47.5,"r":15}],"form":"Cable at top. Elbows pinned. Push down and FLARE rope outward at bottom. Full extension. 1 sec hold.","pre":"Flare at the bottom targets the lateral head specifically.","during":"At bottom spread rope as wide as possible.","check":"Correct: outer side of back of arm burning. Wrong: not feeling outer arm \u2014 flare harder."},{"id":"d1a_rear_delt","giant":true,"giantLabel":"","name":"Rear Delt Fly","focus":"Rear delt \u2014 5th exercise in giant set","rest":90,"sets":[{"t":"Round 1","kg":8,"r":15},{"t":"Round 2","kg":6,"r":20}],"form":"Hinge 45\u00b0. Raise in wide arc to shoulder height. Thumbs DOWN. Elbows lead back and up. Squeeze at peak 2 sec.","pre":"Thumbs down reduces trap involvement. Feel contraction at BACK of shoulder cap.","during":"Lead with elbows going back. Feel contraction at back of shoulder cap.","check":"Correct: burning at back of shoulder cap. Wrong: mid traps \u2014 arms going too high."},{"id":"d1a_cable_crunch","giant":false,"giantLabel":"Abs \u2014 Superset: Cable Crunch then immediately Hanging Leg Raise, rest 60 sec","name":"Cable Crunch","focus":"Rectus abdominis \u2014 weighted","rest":0,"sets":[{"t":"Set 1","kg":27.5,"r":15},{"t":"Set 2","kg":27.5,"r":15},{"t":"Set 3","kg":25,"r":20}],"form":"Kneel facing cable, rope at neck. Crunch through elbows. Hips fixed. Full spine flexion.","pre":"Hips stay completely still \u2014 only spine moves.","during":"Elbows to knees. Feel burn in centre of stomach.","check":"Correct: abs burning. Wrong: hip flexors \u2014 hips are moving."},{"id":"d1a_leg_raise","giant":false,"giantLabel":"","name":"Hanging Leg Raise","focus":"Lower abs \u2014 pelvic tilt is the key","rest":60,"sets":[{"t":"Set 1","kg":0,"r":12},{"t":"Set 2","kg":0,"r":12},{"t":"Set 3","kg":0,"r":15}],"form":"Dead hang. Raise to 90\u00b0. Pelvic tilt BACK at top. Slow lowering.","pre":"Pelvic tilt at top makes this lower abs not hip flexors.","during":"Pelvic tilt every rep. Feel below the belly button.","check":"Correct: lower abs burning. Wrong: hip flexors \u2014 add the pelvic tilt."}]},"b":{"label":"Week B","exercises":[{"id":"d1b_inc_db","giant":false,"giantLabel":"","name":"Incline Dumbbell Press","focus":"Upper chest \u2014 greater stretch than barbell","rest":180,"sets":[{"t":"Warm-up","kg":15,"r":15},{"t":"Set 1","kg":22,"r":7},{"t":"Set 2","kg":22,"r":7},{"t":"Set 3","kg":20,"r":8},{"t":"Set 4","kg":20,"r":8}],"form":"45\u00b0 bench. Natural arc. Greater stretch at bottom than barbell. Control the lowering.","pre":"Dumbbells allow more natural arc and greater ROM.","during":"Upper chest stretch at the bottom. Chase contraction at the top.","check":"Correct: upper chest stretch at bottom. Wrong: shoulder pain \u2014 check wrist angle."},{"id":"d1b_db_press","giant":false,"giantLabel":"","name":"Dumbbell Shoulder Press","focus":"All 3 delt heads \u2014 natural arc vs barbell","rest":180,"sets":[{"t":"Warm-up","kg":10,"r":15},{"t":"Set 1","kg":20,"r":7},{"t":"Set 2","kg":20,"r":7},{"t":"Set 3","kg":18,"r":8},{"t":"Set 4","kg":18,"r":8}],"form":"Dumbbells at shoulder height. Press up in natural arc. Full lockout. Control lowering.","pre":"Each arm works independently \u2014 find left-right imbalances.","during":"Natural arc upward. Full shoulder cap contracted at lockout.","check":"Correct: whole shoulder cap burning. Wrong: front delt only \u2014 start position too far forward."},{"id":"d1b_inc_fly","giant":true,"giantLabel":"Giant Set \u2014 no rest between: Incline Cable Fly \u2192 Cable Lateral Raise \u2192 Overhead DB Ext \u2192 Bar Pushdown \u2192 Rear Delt Cable Pull \u2014 rest 90 sec after all 5","name":"Incline Cable Fly (Low-to-High)","focus":"Upper chest \u2014 lying cable stretch","rest":0,"sets":[{"t":"Round 1","kg":8,"r":12},{"t":"Round 2","kg":8,"r":12}],"form":"Bench at 30\u201345\u00b0 between cable columns. Cables at lowest. Arms out to sides. Bring hands together in arc above upper chest.","pre":"Lying position gives a different stretch to standing cable crossover.","during":"Feel upper chest stretch as arms open wide. Squeeze at top.","check":"Correct: upper chest stretch at bottom. Wrong: elbows bending too much \u2014 keep fixed slight bend."},{"id":"d1b_cable_lat","giant":true,"giantLabel":"","name":"Cable Lateral Raise","focus":"Side delt \u2014 constant cable tension","rest":0,"sets":[{"t":"Round 1","kg":10,"r":15},{"t":"Round 2","kg":8,"r":20}],"form":"Single cable low pulley, side on. Raise to shoulder height. Elbow leads. 3 sec lowering.","pre":"Cable keeps tension at bottom unlike dumbbell.","during":"3-second lowering is where side delt works hardest.","check":"Correct: outer shoulder burning throughout. Wrong: trap shrugging \u2014 reduce weight."},{"id":"d1b_overhead_db","giant":true,"giantLabel":"","name":"Overhead DB Extension","focus":"Tricep long head \u2014 stretch mediated","rest":0,"sets":[{"t":"Round 1","kg":20,"r":12},{"t":"Round 2","kg":18,"r":12}],"form":"Elbows point forward \u2014 fixed. Hands drop behind head for full stretch. Press to extension.","pre":"Long head only fully stretches in this overhead position.","during":"Hold the stretch before every press.","check":"Correct: stretch in back of upper arm at bottom. Wrong: elbows flaring \u2014 stay forward."},{"id":"d1b_bar_push","giant":true,"giantLabel":"","name":"Straight Bar Pushdown","focus":"Tricep medial head \u2014 different to rope","rest":0,"sets":[{"t":"Round 1","kg":47.5,"r":12},{"t":"Round 2","kg":42.5,"r":15}],"form":"Straight bar at top. Elbows pinned. Push straight down. Wrist neutral. Full extension.","pre":"Straight bar targets medial head differently to rope flare.","during":"Wrist neutral throughout.","check":"Correct: back of arm burning. Wrong: wrist pain \u2014 ensure neutral wrist."},{"id":"d1b_rear_cable","giant":true,"giantLabel":"","name":"Rear Delt Cable Pull","focus":"Rear delt \u2014 cable constant tension version","rest":90,"sets":[{"t":"Round 1","kg":10,"r":15},{"t":"Round 2","kg":8,"r":20}],"form":"Cable at face height, single handle. Pull elbow back and out past your ear. Keep elbow high.","pre":"Cable version of rear delt fly. Constant tension differs from dumbbell.","during":"Elbow goes back and OUT. Feel contraction at back of shoulder cap.","check":"Correct: rear delt burning. Wrong: trap engaging \u2014 elbow stays high."},{"id":"d1b_decline_crunch","giant":false,"giantLabel":"Ab let dayIdx=0, tSec=150, tPre=150, tRun=false, tInt=null;
const APPS_URL='https://script.google.com/macros/s/AKfycbwaMRVr3gqoD8Kopf8Ask0WnNY9F3pRvOsUtoGjwiLDoMXD56FJJxBbjMpvhWmsO4XlAg/exec';

// ── User ──
function getUser(){return localStorage.getItem('wt_user')||'';}
function setUser(n){localStorage.setItem('wt_user',n.trim());}
function uk(k){return getUser()+'__'+k;}
function completeOnboard(){
  const n=document.getElementById('ob-name').value.trim();
  if(!n){document.getElementById('ob-name').style.borderColor='var(--red)';return;}
  setUser(n);
  document.getElementById('onboard').style.display='none';
  document.getElementById('app').style.display='flex';
  initApp();
}

// ── Week A/B ──
function getWeek(){
  const now=new Date(),jan1=new Date(now.getFullYear(),0,1);
  const wn=Math.ceil(((now-jan1)/86400000+jan1.getDay()+1)/7);
  return wn%2===1?'a':'b';
}
function getCurrentDay(){
  const v=getWeek(), d=P[dayIdx];
  return {id:d.id,label:d.label,title:d.title,muscle:d.muscle,note:d.note,weekLabel:d[v].label,exercises:d[v].exercises};
}

// ── Session ──
function sk(dayId){return uk('sess_'+dayId);}
function loadSess(dayId){try{return JSON.parse(localStorage.getItem(sk(dayId)))||{};}catch{return {};}}
function saveSess(dayId,s){localStorage.setItem(sk(dayId),JSON.stringify(s));}

// ── Day detection ──
function getDayForToday(){
  const m={1:0,2:1,3:2,4:3,5:4,6:5,0:undefined};
  return m[new Date().getDay()];
}

// ── Timer ──
function pad(n){return String(n).padStart(2,'0');}
function updateDig(){
  const el=document.getElementById('t-dig');
  el.textContent=Math.floor(tSec/60)+':'+pad(tSec%60);
  el.className='timer-num'+(tSec<=10&&tSec>0?' urgent':'');
}
function setTimer(s){
  clearInterval(tInt);tRun=false;tSec=s;tPre=s;updateDig();
  document.getElementById('t-start').textContent='▶ Start';
  document.querySelectorAll('.t-pre').forEach(b=>{
    const v=parseInt(b.textContent.split(':')[0])*60+parseInt(b.textContent.split(':')[1]);
    b.className='t-pre'+(v===s?' on':'');
  });
}
function toggleTimer(){
  const btn=document.getElementById('t-start');
  if(tRun){clearInterval(tInt);tRun=false;btn.textContent='▶ Resume';}
  else{
    tRun=true;btn.textContent='⏸ Pause';
    tInt=setInterval(()=>{
      tSec--;updateDig();
      if(tSec<=0){
        clearInterval(tInt);tRun=false;btn.textContent='▶ Start';
        if(navigator.vibrate)navigator.vibrate([200,100,200]);
      }
    },1000);
  }
}
function resetTimer(){clearInterval(tInt);tRun=false;tSec=tPre;updateDig();document.getElementById('t-start').textContent='▶ Start';}
function kickTimer(s){clearInterval(tInt);tRun=false;tSec=s;tPre=s;updateDig();document.getElementById('t-start').textContent='▶ Start';toggleTimer();}

// ── Render ──
function initApp(){
  const user=getUser();
  const now=new Date();
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  document.getElementById('hdr-date').textContent=days[now.getDay()]+', '+now.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  const todayIdx=getDayForToday();
  if(todayIdx!==undefined)dayIdx=todayIdx;
  buildTabs();
  renderDay();
}

function buildTabs(){
  const c=document.getElementById('day-tabs');c.innerHTML='';
  const shorts=['Push 1','Pull 1','Legs 1','Push 2','Pull 2','Legs 2'];
  P.forEach((d,i)=>{
    const tb=document.createElement('div');
    tb.className='day-tab'+(i===dayIdx?' on':'');
    tb.innerHTML=`<span>${d.label}</span><span class="dt-sub">${shorts[i]||''}</span>`;
    tb.onclick=()=>{dayIdx=i;renderDay();document.querySelectorAll('.day-tab').forEach((t,j)=>t.className='day-tab'+(j===i?' on':''));};
    c.appendChild(tb);
  });
}

function renderDay(){
  const dayData=getCurrentDay();
  const v=getWeek();
  document.getElementById('hdr-title').textContent=dayData.title;
  document.getElementById('week-badge').textContent=dayData.weekLabel;
  const wrap=document.getElementById('exwrap');wrap.innerHTML='';
  const sess=loadSess(dayData.id);
  const exs=dayData.exercises;
  if(!exs||exs.length===0)return;

  // Group by section
  let inGiant=false, giantLabel='', inAbs=false;
  let giantBadgeAdded=false, absBadgeAdded=false;

  // Section labels
  const compoundLbl=document.createElement('div');compoundLbl.className='sec-lbl';compoundLbl.textContent='Compounds';wrap.appendChild(compoundLbl);

  exs.forEach((ex,exIdx)=>{
    // Detect section transitions
    if(ex.giant&&!inGiant){
      inGiant=true;
      const gl=document.createElement('div');gl.className='sec-lbl';gl.textContent='Giant Set';wrap.appendChild(gl);
      if(ex.giantLabel){
        const gb=document.createElement('div');gb.className='giant-badge';
        gb.innerHTML=`<div class="giant-dot"></div><div class="giant-lbl">${ex.giantLabel}</div>`;
        wrap.appendChild(gb);
      }
    }
    if(!ex.giant&&inGiant&&ex.giantLabel){
      // abs section
      inGiant=false;
      const al=document.createElement('div');al.className='sec-lbl';al.textContent='Abs';wrap.appendChild(al);
      const ab=document.createElement('div');ab.className='abs-badge';
      ab.innerHTML=`<div class="abs-dot"></div><div class="abs-lbl">${ex.giantLabel}</div>`;
      wrap.appendChild(ab);
    }

    // Build card
    const workSets=ex.sets.filter(s=>s.t!=='Warm-up');
    const warmSets=ex.sets.filter(s=>s.t==='Warm-up');
    const doneCnt=workSets.filter((_,i)=>sess[ex.id+'_done_'+(warmSets.length+i)]).length;
    const total=workSets.length;
    const allDone=doneCnt===total&&total>0;
    const pct=total?doneCnt/total:0;
    const circ=2*Math.PI*14;
    const off=circ*(1-pct);

    const card=document.createElement('div');
    card.className='ex-card'+(ex.giant?' giant-card':'')+(allDone?' done-card':'');

    let rowsHTML='';
    ex.sets.forEach((s,si)=>{
      const isWarm=s.t==='Warm-up';
      if(isWarm){
        rowsHTML+=`<div class="warmup-row">
          <span class="set-lbl">Warm-up</span>
          <span class="set-kg">${s.kg}<span class="set-kg-unit">kg</span></span>
          <span class="set-reps">× ${s.r}</span>
          <div></div>
        </div>`;
      } else {
        const done=sess[ex.id+'_done_'+si]?true:false;
        rowsHTML+=`<div class="set-row${done?' set-done':''}" onclick="tickSet('${dayData.id}','${ex.id}',${si},${ex.rest||60})">
          <span class="set-lbl">${s.t}</span>
          <span class="set-kg">${s.kg>0?s.kg+'<span class=set-kg-unit>kg</span>':'—'}</span>
          <span class="set-reps">× ${s.r}</span>
          <div class="set-tick${done?' ticked':''}"></div>
        </div>`;
      }
    });

    card.innerHTML=`
      <div class="ex-hdr">
        <div>
          <div class="ex-name">${ex.name}</div>
          <div class="ex-focus">${ex.focus}</div>
        </div>
        <div class="ex-ring">
          <span class="ring-lbl">${doneCnt}/${total}</span>
          <svg width="32" height="32" viewBox="0 0 36 36">
            <circle cx="18" cy="18" r="14" fill="none" stroke="${ex.giant?'#1e2a1e':'#1e1e1e'}" stroke-width="3"/>
            ${pct>0?`<circle cx="18" cy="18" r="14" fill="none" stroke="#4ade80" stroke-width="3" stroke-dasharray="${circ}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 18 18)"/>`:''}
          </svg>
        </div>
      </div>
      ${rowsHTML}
    `;
    wrap.appendChild(card);
  });
}

function tickSet(dayId,exId,si,rest){
  const s=loadSess(dayId);
  s[exId+'_done_'+si]=!s[exId+'_done_'+si];
  saveSess(dayId,s);
  // Update just this row and ring without full re-render
  const row=document.querySelector(`.set-row[onclick*="'${exId}',${si},"]`);
  if(row){
    const done=s[exId+'_done_'+si];
    row.className='set-row'+(done?' set-done':'');
    const tick=row.querySelector('.set-tick');
    if(tick)tick.className='set-tick'+(done?' ticked':'');
    if(done)kickTimer(rest||60);
  }
  // Update ring
  refreshRing(dayId,exId);
}

function refreshRing(dayId,exId){
  const dayData=getCurrentDay();
  const ex=dayData.exercises.find(e=>e.id===exId);
  if(!ex)return;
  const s=loadSess(dayId);
  const workSets=ex.sets.filter(st=>st.t!=='Warm-up');
  const warmSets=ex.sets.filter(st=>st.t==='Warm-up');
  const done=workSets.filter((_,i)=>s[ex.id+'_done_'+(warmSets.length+i)]).length;
  const total=workSets.length;
  const pct=total?done/total:0;
  const circ=2*Math.PI*14;
  const off=circ*(1-pct);
  // Find the card containing this exercise
  const rows=document.querySelectorAll(`.set-row[onclick*="'${exId}',"]`);
  if(!rows.length)return;
  const card=rows[0].closest('.ex-card');
  if(!card)return;
  const ring=card.querySelector('.ex-ring');
  if(!ring)return;
  ring.innerHTML=`<span class="ring-lbl">${done}/${total}</span>
    <svg width="32" height="32" viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="14" fill="none" stroke="${ex.giant?'#1e2a1e':'#1e1e1e'}" stroke-width="3"/>
      ${pct>0?`<circle cx="18" cy="18" r="14" fill="none" stroke="#4ade80" stroke-width="3" stroke-dasharray="${circ}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 18 18)"/>`:''}
    </svg>`;
  if(done===total&&total>0)card.classList.add('done-card');
  else card.classList.remove('done-card');
}

function finishDay(){
  const d=getCurrentDay();
  const s=loadSess(d.id);
  const exs=d.exercises;
  const total=exs.reduce((a,e)=>a+e.sets.filter(st=>st.t!=='Warm-up').length,0);
  const done=exs.reduce((a,e)=>a+e.sets.filter((_,i)=>s[e.id+'_done_'+i]).length,0);
  if(done<total&&!confirm(`Only ${done}/${total} sets done. Finish anyway?`))return;
  localStorage.removeItem(sk(d.id));
  renderDay();
  alert('Great work! Session complete.');
}

function syncSheets(){
  const d=getCurrentDay();
  const s=loadSess(d.id);
  const user=getUser();
  const rows=[];
  const date=new Date().toISOString().split('T')[0];
  d.exercises.forEach(ex=>{
    ex.sets.forEach((st,si)=>{
      if(s[ex.id+'_done_'+si]){
        rows.push({user,date,day:d.id,exercise:ex.name,set:st.t,kg:st.kg,reps:st.r});
      }
    });
  });
  if(!rows.length){alert('No completed sets to sync.');return;}
  fetch(APPS_URL,{method:'POST',body:JSON.stringify(rows)})
    .then(r=>r.json()).then(()=>alert('Synced!'))
    .catch(()=>alert('Sync failed — check connection.'));
}

function showSettings(){
  const name=getUser();
  const newName=prompt('Your name:',name);
  if(newName&&newName.trim()){setUser(newName.trim());alert('Name updated!');}
}

// ── Boot ──
const user=getUser();
if(user){
  document.getElementById('app').style.display='flex';
  initApp();
} else {
  document.getElementById('onboard').style.display='flex';
}
document.getElementById('ob-name').addEventListener('keydown',e=>{if(e.key==='Enter')completeOnboard();});
</script>
