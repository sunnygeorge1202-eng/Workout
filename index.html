<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f0f">
<title>Workout Tracker</title>
<style>
:root {
  --bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#252525;--bg4:#2e2e2e;
  --border:#2e2e2e;--border2:#3a3a3a;
  --text:#f0f0f0;--text2:#aaa;--text3:#666;
  --green:#22c55e;--green-bg:#052e16;--green-border:#166534;
  --amber:#f59e0b;--amber-bg:#1c1003;--amber-border:#78350f;
  --red:#ef4444;--blue-bg:#0c1a2e;--purple:#a78bfa;
  --r:12px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;}
body{padding-bottom:100px;}
.nav{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.nav-left h1{font-size:16px;font-weight:700;}
.nav-left .date{font-size:11px;color:var(--text3);margin-top:1px;}
.nav-right{display:flex;gap:6px;}
.nav-btn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:6px 10px;font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap;}
.timer-section{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 16px 6px;}
.timer-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.timer-dig{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;min-width:80px;letter-spacing:-1px;transition:color 0.3s;}
.timer-dig.idle{color:var(--text2);}
.timer-dig.running{color:var(--green);}
.timer-dig.warn{color:var(--amber);}
.timer-dig.done{color:var(--red);}
.timer-btns{display:flex;gap:6px;flex:1;}
.t-btn{flex:1;padding:9px 8px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;}
.t-btn:active{transform:scale(0.96);}
.t-btn.go{background:var(--green);border-color:var(--green);color:#000;}
.presets{display:flex;gap:5px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;}
.presets::-webkit-scrollbar{display:none;}
.pre-btn{flex-shrink:0;padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:12px;cursor:pointer;transition:all 0.15s;}
.pre-btn.on{background:var(--bg3);color:var(--text);border-color:var(--border2);}
.day-scroll{display:flex;overflow-x:auto;gap:6px;padding:10px 16px 8px;border-bottom:1px solid var(--border);scrollbar-width:none;}
.day-scroll::-webkit-scrollbar{display:none;}
.d-tab{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:12px;font-weight:500;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.d-tab.on{background:var(--text);color:#000;border-color:var(--text);font-weight:700;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 16px;}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;}
.stat-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px;}
.stat-v{font-size:17px;font-weight:700;}
.stat-v.g{color:var(--green);}
.exwrap{padding:0 16px;}
.sec-head{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin:14px 0 8px;}
.ss-badge{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.ss-line{flex:1;height:1px;background:var(--amber-border);}
.ss-label{font-size:10px;color:var(--amber);font-weight:600;letter-spacing:0.06em;text-transform:uppercase;}
.ex-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden;transition:border-color 0.2s;}
.ex-card.open{border-color:var(--border2);}
.ex-card.ss-card{border-left:2px solid var(--amber-border);}
.ex-hdr{display:flex;align-items:center;padding:13px 13px 11px;cursor:pointer;gap:10px;}
.ex-badge{background:var(--bg3);border:1px solid var(--border);border-radius:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text3);flex-shrink:0;}
.ex-badge.ss{background:var(--amber-bg);border-color:var(--amber-border);color:var(--amber);}
.ex-info{flex:1;min-width:0;}
.ex-name{font-size:14px;font-weight:600;line-height:1.2;}
.ex-focus{font-size:11px;color:var(--text3);margin-top:2px;}
.ex-ring{position:relative;width:34px;height:34px;flex-shrink:0;}
.ex-ring svg{transform:rotate(-90deg);}
.ring-track{fill:none;stroke:var(--bg3);stroke-width:3;}
.ring-fill{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-dasharray:82;stroke-dashoffset:82;transition:stroke-dashoffset 0.4s ease;}
.ring-lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--text3);}
.chevron{font-size:16px;color:var(--text3);transition:transform 0.2s;flex-shrink:0;}
.ex-card.open .chevron{transform:rotate(180deg);}
.ex-body{display:none;border-top:1px solid var(--border);}
.ex-card.open .ex-body{display:block;}
.cues{background:var(--bg3);border-bottom:1px solid var(--border);padding:11px 13px;}
.cue-tabs{display:flex;gap:5px;margin-bottom:8px;}
.c-tab{padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:11px;cursor:pointer;transition:all 0.15s;}
.c-tab.on{background:var(--bg4);color:var(--text2);border-color:var(--border2);}
.cue-txt{font-size:12px;color:var(--text2);line-height:1.6;}
.cue-txt.hide{display:none;}
.sets-wrap{padding:11px 13px;}
.sets-hdr{display:grid;grid-template-columns:54px 1fr 1fr 1fr 38px;gap:5px;margin-bottom:5px;}
.sets-hdr span{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;text-align:center;}
.sets-hdr span:first-child{text-align:left;}
.set-row{display:grid;grid-template-columns:54px 1fr 1fr 1fr 38px;gap:5px;align-items:center;margin-bottom:5px;}
.set-tag{font-size:11px;color:var(--text3);}
.s-in{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:8px 3px;font-size:13px;font-weight:600;color:var(--text);text-align:center;width:100%;-moz-appearance:textfield;}
.s-in::-webkit-outer-spin-button,.s-in::-webkit-inner-spin-button{-webkit-appearance:none;}
.s-in:focus{outline:none;border-color:var(--border2);}
.s-in.pre{color:var(--text3);font-weight:400;}
.s-in.mod{color:var(--amber);border-color:var(--amber-border);}
.tick{width:34px;height:34px;border-radius:var(--rs);border:1px solid var(--border);background:transparent;color:transparent;font-size:16px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;}
.tick:active{transform:scale(0.9);}
.tick.done{background:var(--green-bg);border-color:var(--green-border);color:var(--green);}
.rest-row{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:var(--bg3);border-top:1px solid var(--border);}
.rest-txt{font-size:11px;color:var(--text3);}
.rest-go{padding:5px 14px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:11px;cursor:pointer;}
.hist-wrap{padding:10px 13px 13px;border-top:1px solid var(--border);}
.hist-title{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:7px;}
.hist-row{font-size:11px;color:var(--text3);margin-bottom:3px;line-height:1.5;}
.hist-row span{color:var(--text2);}
.hist-empty{font-size:11px;color:var(--text3);font-style:italic;}
.finish-area{padding:14px 16px;}
.fin-btn{width:100%;padding:14px;border-radius:var(--r);border:none;background:var(--green);color:#000;font-size:15px;font-weight:700;cursor:pointer;}
.fin-btn:active{transform:scale(0.98);}
.done-wrap{display:none;text-align:center;padding:50px 20px;}
.done-wrap.show{display:block;}
.done-icon{font-size:52px;margin-bottom:14px;}
.done-title{font-size:22px;font-weight:700;margin-bottom:6px;}
.done-sub{font-size:13px;color:var(--text2);line-height:1.6;}
.done-back{margin-top:20px;padding:12px 24px;border-radius:var(--r);border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:14px;cursor:pointer;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:200;align-items:flex-end;}
.overlay.show{display:flex;}
.modal{background:var(--bg2);border-radius:var(--r) var(--r) 0 0;border:1px solid var(--border);padding:18px 16px 36px;width:100%;max-height:75vh;overflow-y:auto;}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.modal-hdr h3{font-size:16px;font-weight:700;}
.modal-close{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:5px 12px;font-size:12px;color:var(--text2);cursor:pointer;}
.h-entry{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;margin-bottom:8px;}
.h-date{font-size:11px;color:var(--text2);font-weight:600;margin-bottom:5px;}
.h-sets{font-size:11px;color:var(--text3);line-height:1.7;}
</style>
</head>
<body>
<div class="nav">
  <div class="nav-left">
    <h1 id="nav-title">Workout Tracker</h1>
    <div class="date" id="nav-date"></div>
  </div>
  <div class="nav-right">
    <button class="nav-btn" onclick="openHistory()">📋 History</button>
    <button class="nav-btn" onclick="clearDay()">↺ Reset</button>
  </div>
</div>
<div class="timer-section">
  <div class="timer-row">
    <div class="timer-dig idle" id="tdig">2:30</div>
    <div class="timer-btns">
      <button class="t-btn go" id="t-start" onclick="toggleTimer()">▶ Start</button>
      <button class="t-btn" onclick="resetTimer()">↺ Reset</button>
    </div>
  </div>
  <div class="presets" id="presets">
    <button class="pre-btn on" onclick="setPre(150)">2:30</button>
    <button class="pre-btn" onclick="setPre(120)">2:00</button>
    <button class="pre-btn" onclick="setPre(90)">1:30</button>
    <button class="pre-btn" onclick="setPre(60)">1:00</button>
    <button class="pre-btn" onclick="setPre(45)">0:45</button>
  </div>
</div>
<div class="day-scroll" id="day-tabs"></div>
<div class="stats">
  <div class="stat"><div class="stat-l">Sets</div><div class="stat-v g" id="s-sets">0/0</div></div>
  <div class="stat"><div class="stat-l">Volume kg</div><div class="stat-v" id="s-vol">0</div></div>
  <div class="stat"><div class="stat-l">Week</div><div class="stat-v" id="s-week">1</div></div>
</div>
<div class="exwrap" id="exwrap"></div>
<div class="finish-area" id="finish-area">
  <button class="fin-btn" onclick="finishDay()">✓ Finish Workout</button>
</div>
<div class="done-wrap" id="done-wrap">
  <div class="done-icon">💪</div>
  <div class="done-title">Session Complete!</div>
  <div class="done-sub" id="done-sub"></div>
  <button class="done-back" onclick="backFromDone()">← Back to program</button>
</div>
<div class="overlay" id="hist-modal" onclick="maybeClose(event)">
  <div class="modal">
    <div class="modal-hdr">
      <h3 id="hist-title">History</h3>
      <button class="modal-close" onclick="closeHistory()">✕ Close</button>
    </div>
    <div id="hist-body"></div>
  </div>
</div>
<script>
const P=[
  // DAY 1 — Chest Heavy + Triceps Light
  {id:'d1',label:'Day 1',title:'Chest Heavy + Triceps Light',
   note:'Face pull warm-up: 2×15 light weight before any pressing — primes rotator cuff.',
   sections:[
    {name:'Chest',items:[
      {id:'d1_inc_bp',ss:false,name:'Incline Barbell Press',focus:'Upper chest — primary compound',rest:150,
       form:'Set bench to 30–45°. Grip slightly wider than shoulder width. Retract scapula and create a slight arch — chest up. Unrack and lower bar to upper chest in 2–3 seconds. Elbows at 45° — not flared to 90°, not tucked fully in. Touch chest lightly, drive up explosively. Bar path should be slightly diagonal — not straight up.',
       mmc:'Before you unrack, squeeze your shoulder blades together hard like cracking a walnut. Hold that position the entire set — this locks your chest as the prime mover. Imagine pushing the ceiling away with your upper chest only. If you feel it in your front delt, the bench angle is too steep.',
       sets:[{t:'Warm-up',kg:40,r:15},{t:'Set 1',kg:65,r:8},{t:'Set 2',kg:65,r:8},{t:'Set 3',kg:62.5,r:10},{t:'Set 4',kg:60,r:12}]},
      {id:'d1_flat_bp',ss:false,name:'Flat Bench Press',focus:'Mid chest — compound',rest:120,
       form:'Lie flat, grip just outside shoulder width. Feet flat on floor. Retract scapula — your lower back will have a slight arch, this is correct. Lower bar to mid-chest / lower sternum in 2 seconds. Elbows at 45° to torso. Drive bar up and slightly back toward the rack. Full lockout at the top.',
       mmc:'Scapula retraction is everything here. If your shoulders round forward at any point, the chest stops being the prime mover. Think "chest up, shoulders back" before every rep. Drive through the chest — not the shoulders.',
       sets:[{t:'Set 1',kg:65,r:10},{t:'Set 2',kg:65,r:10},{t:'Set 3',kg:60,r:12}]},
      {id:'d1_inc_fly',ss:false,name:'Incline Cable Fly',focus:'Upper chest — stretch overload',rest:75,
       form:'Set bench at 30° between two low cable pulleys. Slight fixed bend in elbows throughout — never change this angle. Palms facing up or inward. Start with arms wide and low, bring hands together in a wide arc up to chest height. Pause 1 second at full stretch at the bottom. Control the return for 3 seconds.',
       mmc:'The deep stretch at the bottom is the entire point of this exercise — this is where stretch-mediated hypertrophy occurs. Think of hugging a giant tree. Pause at the bottom and feel the upper chest fully lengthened before bringing hands together. Do not rush through the stretch.',
       sets:[{t:'Set 1',kg:15,r:12},{t:'Set 2',kg:15,r:12},{t:'Set 3',kg:12,r:15}]},
      {id:'d1_cross_htol',ss:true,ssLabel:'Superset — high-to-low crossover then immediately pec deck, rest 60 sec after pec deck',name:'Cable Crossover (High-to-Low)',focus:'Lower chest — peak contraction',rest:60,
       form:'Set cables HIGH above head. Stand in centre, slight forward lean. Slight fixed elbow bend. Bring hands DOWN and together in a downward arc ending at hip level. Hands can cross slightly. Pause and squeeze hard at the bottom for 1 second. Slow controlled return — do not let cables snap you back.',
       mmc:'The downward arc specifically activates the lower chest fibres that run diagonally. Feel the contraction at the BASE of your pec — not the middle. The crossing of hands at the bottom squeezes the inner lower chest. Hold that squeeze.',
       sets:[{t:'Set 1',kg:12,r:15},{t:'Set 2',kg:12,r:15},{t:'Set 3',kg:10,r:20}]},
      {id:'d1_pec_deck',ss:true,ssLabel:'',name:'Pec Deck (Machine Fly)',focus:'Inner chest — peak contraction',rest:60,
       form:'Sit upright with chest against the pad. Forearms on pads or hands on handles at chest height. Bring arms together slowly — do not rush. Pause and squeeze HARD at the peak for 1–2 seconds. Control the return to full stretch — do not let weight stack touch between reps.',
       mmc:'Inner chest fibres only fire in the fully shortened position — the squeeze at the peak is the entire stimulus. Imagine trying to crush something between your pecs at full contraction. If you do not feel the inner chest burning, you are going too heavy and losing the squeeze.',
       sets:[{t:'Set 1',kg:50,r:12},{t:'Set 2',kg:50,r:12},{t:'Set 3',kg:45,r:15}]}
    ]},
    {name:'Triceps',items:[
      {id:'d1_rope_push',ss:false,name:'Rope Pushdown',focus:'Lateral head — triceps light day finisher',rest:90,
       form:'Stand close to cable, elbows pinned firmly at sides — they must not move throughout. Grip rope with thumbs pointing up. Push down and critically FLARE the rope outward at the bottom — split the rope apart at full extension. Hold 1 second at full extension. Slow return in 2 seconds.',
       mmc:'The flare at the bottom is non-negotiable — without it you are only getting partial lateral head activation. Think "spread the rope apart" at the bottom of every single rep. This is a light day for triceps — focus on perfect form and feeling the lateral head contract, not weight.',
       sets:[{t:'Set 1',kg:47.5,r:12},{t:'Set 2',kg:47.5,r:12},{t:'Set 3',kg:42.5,r:15}]}
    ]}
  ]},

  // DAY 2 — Back Heavy + Biceps
  {id:'d2',label:'Day 2',title:'Back Heavy + Biceps',
   note:'Biceps are pre-fatigued from all pulling. Keep curl form strict — no swinging.',
   sections:[
    {name:'Back',items:[
      {id:'d2_pullups',ss:false,name:'Pull-Ups',focus:'Lat width — primary compound',rest:150,
       form:'Start from a dead hang — full shoulder depression, arms fully extended. Grip slightly wider than shoulder width. Initiate by pulling elbows DOWN and BACK — not just down. Drive chest toward the bar. Chin clears the bar at the top. Lower slowly for 3 seconds back to dead hang. No kipping.',
       mmc:'Do not think "pull with arms". Think "drive elbows into your back pockets". Your lats are the engine — arms are just hooks. At the top, feel your lats fully contracted against your sides. At the bottom, feel the full lat stretch in the dead hang before the next rep.',
       sets:[{t:'Set 1',kg:0,r:6},{t:'Set 2',kg:0,r:6},{t:'Set 3',kg:0,r:5}]},
      {id:'d2_lat_pull',ss:false,name:'Lat Pulldown',focus:'Lat width — volume',rest:120,
       form:'Sit with thighs locked under pad. Grip slightly wider than shoulder width. Slight lean back 10–15° — fixed throughout. Pull bar to upper chest leading with elbows — not hands. At the bottom, squeeze lats and hold 1 second. Return slowly — let shoulder blades rise and lats stretch fully at the top.',
       mmc:'At the top of every rep, feel your lats stretched like wings spreading before you pull. Your hands are hooks — the lats do the work. At the bottom, think "elbows to back pockets" and feel the lat contracted hard against your side.',
       sets:[{t:'Warm-up',kg:40,r:15},{t:'Set 1',kg:70,r:10},{t:'Set 2',kg:70,r:10},{t:'Set 3',kg:65,r:12}]},
      {id:'d2_tbar',ss:false,name:'T-Bar / Barbell Row',focus:'Mid back thickness — mass builder',rest:120,
       form:'Hinge at hips to 45°, knees slightly bent, neutral spine throughout — never round the lower back. Pull bar to lower chest or upper abdomen. Lead with elbows going back past the torso — not hands. At the top, try to touch shoulder blades together and hold 1 second. Lower under control for 2–3 seconds.',
       mmc:'At the peak of every rep, squeeze your shoulder blades together as hard as you can and hold for 1 second. That contraction is what builds mid back thickness. If you cannot hold the squeeze, you are using too much momentum — reduce weight.',
       sets:[{t:'Set 1',kg:60,r:10},{t:'Set 2',kg:60,r:10},{t:'Set 3',kg:55,r:12}]},
      {id:'d2_cable_row',ss:false,name:'Seated Cable Row',focus:'Lower lat + mid back',rest:90,
       form:'Sit tall with slight knee bend. At the start of each rep, reach forward fully — let scapula protract and lats stretch. Pull handle to lower sternum or upper abdomen. Drive elbows straight back. At the end, squeeze shoulder blades. Do not rock the torso — movement is in the arms and scapula only.',
       mmc:'This exercise has two distinct positions — full stretch (reach forward, lats lengthened, scapula protracted) and full contraction (elbows back, scapula retracted, lats squeezed). Hit both positions every rep. Not a swing between them — two deliberate positions.',
       sets:[{t:'Set 1',kg:55,r:12},{t:'Set 2',kg:55,r:12},{t:'Set 3',kg:50,r:15}]}
    ]},
    {name:'Biceps',items:[
      {id:'d2_bar_curl',ss:true,ssLabel:'Superset — barbell curl then immediately hammer curl, rest 90 sec after hammer',name:'Barbell Curl',focus:'Bicep overall mass — primary',rest:90,
       form:'Stand tall, elbows pinned at sides — they must not drift forward at all. Supinate wrists as you curl upward — turn pinkies up. Curl to full contraction, elbows stay at sides. Lower to FULL extension — do not stop short at the bottom. No body swing — if you swing, reduce weight.',
       mmc:'At the very top, turn your pinkies up toward the ceiling as far as possible — this is peak supination and fully activates the short head. Full extension at the bottom stretches the long head. Both ends of the range matter equally. Biceps are pre-fatigued — keep weight honest.',
       sets:[{t:'Warm-up',kg:15,r:15},{t:'Set 1',kg:25,r:10},{t:'Set 2',kg:25,r:10},{t:'Set 3',kg:22.5,r:12}]},
      {id:'d2_hammer',ss:true,ssLabel:'',name:'Hammer Curl',focus:'Brachialis — adds thickness and pushes peak up',rest:90,
       form:'Neutral grip — thumbs pointing forward throughout. Do NOT supinate at any point. Curl to shoulder height. Elbows stay at sides. Go directly from barbell curl. Full extension each rep. Can be done alternating or simultaneously.',
       mmc:'The brachialis sits directly under the bicep and physically lifts it when developed — it is what creates the peak. You should feel the muscle on the outer side of your upper arm working, not the bicep belly. Neutral grip is mandatory — supinating defeats the purpose.',
       sets:[{t:'Set 1',kg:14,r:12},{t:'Set 2',kg:14,r:12},{t:'Set 3',kg:12,r:15}]}
    ]}
  ]},

  // DAY 3 — Shoulders Heavy + Legs Light
  {id:'d3',label:'Day 3',title:'Shoulders Heavy + Legs Light',
   note:'Face pull warm-up: 2×15 light before pressing. Legs are secondary today — full effort, lower volume.',
   sections:[
    {name:'Shoulders',items:[
      {id:'d3_ohp',ss:false,name:'Overhead Barbell Press',focus:'All 3 delt heads — primary compound',rest:150,
       form:'Standing or seated. Grip just outside shoulder width. Bar rests on upper chest / clavicle. Brace core hard. Press bar up in a slight arc — bar travels up and slightly back at the top. Full lockout — shrug slightly at lockout to engage upper trap. Lower to clavicle in 2–3 seconds. Elbows should be slightly in front of the bar at the bottom, not flared to 90°.',
       mmc:'Think "press the ceiling away". At the top lockout, shrug slightly — this fully stabilises the shoulder and activates upper trap. The side delt fires progressively more as the arm moves away from the body. If you feel it mostly in front delt, your elbows are too far forward at the start.',
       sets:[{t:'Warm-up',kg:30,r:15},{t:'Set 1',kg:47.5,r:8},{t:'Set 2',kg:47.5,r:8},{t:'Set 3',kg:42.5,r:10},{t:'Set 4',kg:40,r:12}]},
      {id:'d3_lat_raise',ss:true,ssLabel:'Superset — lateral raise then immediately front raise, rest 75 sec after front raise',name:'Lateral Raise',focus:'Side delt — shoulder width',rest:75,
       form:'Slight forward lean from hips. Slight fixed bend in elbows throughout — do not change this. Lead with ELBOWS not hands — imagine pushing the weight up with your elbows. Raise to just above shoulder height. At the top, tilt little finger up slightly (like pouring a jug) — this is external rotation and maximises side delt activation. Lower SLOWLY over 3 seconds — this is the working part.',

// STATE
let dayIdx=0,tSec=150,tPre=150,tRun=false,tInt=null;
function pad(n){return String(n).padStart(2,'0');}
function fmt(s){return `${Math.floor(s/60)}:${pad(s%60)}`;}
function todayKey(){return new Date().toISOString().split('T')[0];}
function sessionKey(id){return `wt_s_${id}_${todayKey()}`;}
function histKey(id){return `wt_h_${id}`;}
function weekNum(){let s=localStorage.getItem('wt_start');if(!s){s=new Date().toISOString();localStorage.setItem('wt_start',s);}return Math.floor((new Date()-new Date(s))/(7*86400000))+1;}
function loadSess(id){try{return JSON.parse(localStorage.getItem(sessionKey(id))||'{}');}catch(e){return {};}}
function saveSess(id,d){localStorage.setItem(sessionKey(id),JSON.stringify(d));}
function loadHist(id){try{return JSON.parse(localStorage.getItem(histKey(id))||'[]');}catch(e){return [];}}
function saveHist(id,entry){const h=loadHist(id);h.unshift(entry);if(h.length>8)h.pop();localStorage.setItem(histKey(id),JSON.stringify(h));}

// TIMER
function updateTdig(){const el=document.getElementById('tdig');if(tSec<=0){el.textContent='GO!';el.className='timer-dig done';}else if(tSec<=10){el.textContent=fmt(tSec);el.className='timer-dig warn';}else{el.textContent=fmt(tSec);el.className=tRun?'timer-dig running':'timer-dig idle';}}
function setPre(s){clearInterval(tInt);tRun=false;tPre=s;tSec=s;updateTdig();document.getElementById('t-start').textContent='▶ Start';document.querySelectorAll('.pre-btn').forEach(b=>{b.classList.toggle('on',parseInt(b.textContent.split(':').reduce((a,v,i)=>a+(i?+v:+v*60),0))===s);});}
function toggleTimer(){const btn=document.getElementById('t-start');if(tRun){clearInterval(tInt);tRun=false;btn.textContent='▶ Resume';}else{tRun=true;btn.textContent='⏸ Pause';tInt=setInterval(()=>{tSec--;updateTdig();if(tSec<=0){clearInterval(tInt);tRun=false;btn.textContent='▶ Start';if(navigator.vibrate)navigator.vibrate([200,100,200]);}},1000);}}
function resetTimer(){clearInterval(tInt);tRun=false;tSec=tPre;updateTdig();document.getElementById('t-start').textContent='▶ Start';}
function kickTimer(s){clearInterval(tInt);tRun=false;tPre=s;tSec=s;updateTdig();document.getElementById('t-start').textContent='▶ Start';document.querySelectorAll('.pre-btn').forEach(b=>{b.classList.toggle('on',parseInt(b.textContent.split(':').reduce((a,v,i)=>a+(i?+v:+v*60),0))===s);});toggleTimer();window.scrollTo({top:0,behavior:'smooth'});}

// BUILD UI
function buildTabs(){const c=document.getElementById('day-tabs');c.innerHTML='';P.forEach((d,i)=>{const b=document.createElement('button');b.className='d-tab'+(i===dayIdx?' on':'');b.textContent=`${d.label}: ${d.title}`;b.onclick=()=>switchDay(i);c.appendChild(b);});}
function switchDay(i){dayIdx=i;buildTabs();renderDay();}
function renderDay(){
  const day=P[dayIdx];
  document.getElementById('nav-title').textContent=`${day.label} — ${day.title}`;
  document.getElementById('s-week').textContent=weekNum();
  document.getElementById('done-wrap').classList.remove('show');
  document.getElementById('finish-area').style.display='block';
  const wrap=document.getElementById('exwrap');wrap.innerHTML='';
  const sess=loadSess(day.id);
  if(day.note){const n=document.createElement('div');n.style.cssText='margin:10px 0 4px;padding:8px 12px;background:var(--blue-bg);border:1px solid #1e3a5f;border-radius:var(--rs);font-size:11px;color:#93c5fd;line-height:1.5;';n.textContent='📌 '+day.note;wrap.appendChild(n);}
  day.sections.forEach(sec=>{
    const sh=document.createElement('div');sh.className='sec-head';sh.textContent=sec.name;wrap.appendChild(sh);
    sec.items.forEach(ex=>{
      if(ex.ss&&ex.ssLabel){const badge=document.createElement('div');badge.className='ss-badge';badge.innerHTML=`<div class="ss-line"></div><div class="ss-label">⚡ ${ex.ssLabel}</div><div class="ss-line"></div>`;wrap.appendChild(badge);}
      wrap.appendChild(buildCard(ex,sess,day.id));
    });
  });
  updateStats();
}
function buildCard(ex,sess,dayId){
  const card=document.createElement('div');
  card.className='ex-card'+(ex.ss?' ss-card':'');
  card.id='c-'+ex.id;
  const tot=ex.sets.length;
  const done=ex.sets.filter((_,i)=>sess[ex.id+'_done_'+i]).length;
  const off=Math.round(82-(done/tot)*82);
  const hist=getExHist(ex.id,dayId);
  card.innerHTML=`
    <div class="ex-hdr" onclick="toggle('${ex.id}')">
      <div class="ex-badge${ex.ss?' ss':''}">${ex.ss?'SS':tot}</div>
      <div class="ex-info"><div class="ex-name">${ex.name}</div><div class="ex-focus">${ex.focus}</div></div>
      <div class="ex-ring">
        <svg viewBox="0 0 34 34" width="34" height="34">
          <circle class="ring-track" cx="17" cy="17" r="13"/>
          <circle class="ring-fill" cx="17" cy="17" r="13" style="stroke-dashoffset:${off}"/>
        </svg>
        <div class="ring-lbl">${done}/${tot}</div>
      </div>
      <span class="chevron">⌄</span>
    </div>
    <div class="ex-body" id="b-${ex.id}">
      <div class="cues">
        <div class="cue-tabs">
          <button class="c-tab on" onclick="showCue(event,'${ex.id}','form')">Form</button>
          <button class="c-tab" onclick="showCue(event,'${ex.id}','mmc')">Mind-Muscle</button>
        </div>
        <div class="cue-txt" id="cf-${ex.id}">${ex.form}</div>
        <div class="cue-txt hide" id="cm-${ex.id}">${ex.mmc}</div>
      </div>
      <div class="sets-wrap">
        <div class="sets-hdr"><span></span><span>Target</span><span>Actual kg</span><span>Reps</span><span></span></div>
        ${ex.sets.map((s,i)=>{
          const aKg=sess[ex.id+'_kg_'+i]!==undefined?sess[ex.id+'_kg_'+i]:s.kg;
          const aR=sess[ex.id+'_r_'+i]!==undefined?sess[ex.id+'_r_'+i]:s.r;
          const isDone=sess[ex.id+'_done_'+i]||false;
          return `<div class="set-row" id="sr-${ex.id}-${i}">
            <span class="set-tag">${s.t}</span>
            <input class="s-in pre" type="number" value="${s.kg}" readonly step="2.5">
            <input class="s-in${aKg!==s.kg?' mod':''}" type="number" value="${aKg}" step="2.5" min="0"
              onchange="logKg('${dayId}','${ex.id}',${i},this.value,${s.kg})" onfocus="this.select()">
            <input class="s-in${aR!==s.r?' mod':''}" type="number" value="${aR}" step="1" min="0"
              onchange="logR('${dayId}','${ex.id}',${i},this.value,${s.r})" onfocus="this.select()">
            <button class="tick${isDone?' done':''}" id="tk-${ex.id}-${i}"
              onclick="tickSet('${dayId}','${ex.id}',${i},${ex.rest})">${isDone?'✓':''}</button>
          </div>`;
        }).join('')}
      </div>
      <div class="rest-row">
        <span class="rest-txt">⏱ Rest: ${fmt(ex.rest)}</span>
        <button class="rest-go" onclick="kickTimer(${ex.rest})">Start rest ↑</button>
      </div>
      <div class="hist-wrap">
        <div class="hist-title">Previous sessions</div>
        ${hist.length===0
          ?'<div class="hist-empty">No history yet — complete a session to start tracking</div>'
          :hist.map(h=>`<div class="hist-row">${h.date} — <span>${h.sets.filter(s=>s.done).map(s=>`${s.kg}×${s.r}`).join('  ')}</span></div>`).join('')
        }
      </div>
    </div>`;
  return card;
}
function getExHist(exId,dayId){const h=loadHist(dayId);return h.map(e=>({date:e.date,sets:(e.sets&&e.sets[exId])||[]})).filter(e=>e.sets.some(s=>s.done)).slice(0,3);}
function toggle(id){document.getElementById('c-'+id).classList.toggle('open');}
function showCue(e,id,type){document.getElementById('cf-'+id).classList.toggle('hide',type!=='form');document.getElementById('cm-'+id).classList.toggle('hide',type!=='mmc');e.currentTarget.closest('.cue-tabs').querySelectorAll('.c-tab').forEach(t=>t.classList.remove('on'));e.currentTarget.classList.add('on');}
function logKg(dayId,exId,i,val,pre){const s=loadSess(dayId);s[exId+'_kg_'+i]=parseFloat(val);saveSess(dayId,s);const inp=document.querySelectorAll(`#sr-${exId}-${i} .s-in:not(.pre)`)[0];if(inp)inp.className='s-in'+(parseFloat(val)!==pre?' mod':'');updateStats();}
function logR(dayId,exId,i,val,pre){const s=loadSess(dayId);s[exId+'_r_'+i]=parseInt(val);saveSess(dayId,s);updateStats();}
function tickSet(dayId,exId,i,rest){const s=loadSess(dayId);const k=exId+'_done_'+i;s[k]=!s[k];saveSess(dayId,s);const btn=document.getElementById('tk-'+exId+'-'+i);btn.className='tick'+(s[k]?' done':'');btn.textContent=s[k]?'✓':'';refreshRing(exId,dayId);updateStats();if(s[k])kickTimer(rest);}
function refreshRing(exId,dayId){const day=P[dayIdx];let ex=null;for(const sec of day.sections)for(const e of sec.items)if(e.id===exId)ex=e;if(!ex)return;const s=loadSess(dayId);const done=ex.sets.filter((_,i)=>s[exId+'_done_'+i]).length;const off=Math.round(82-(done/ex.sets.length)*82);const fill=document.querySelector(`#c-${exId} .ring-fill`);const lbl=document.querySelector(`#c-${exId} .ring-lbl`);if(fill)fill.style.strokeDashoffset=off;if(lbl)lbl.textContent=`${done}/${ex.sets.length}`;}
function updateStats(){const day=P[dayIdx];const s=loadSess(day.id);let tot=0,done=0,vol=0;day.sections.forEach(sec=>sec.items.forEach(ex=>{ex.sets.forEach((set,i)=>{tot++;if(s[ex.id+'_done_'+i]){done++;const kg=s[ex.id+'_kg_'+i]!==undefined?s[ex.id+'_kg_'+i]:set.kg;const r=s[ex.id+'_r_'+i]!==undefined?s[ex.id+'_r_'+i]:set.r;vol+=kg*r;}});}));document.getElementById('s-sets').textContent=`${done}/${tot}`;document.getElementById('s-vol').textContent=Math.round(vol).toLocaleString('en-IN');}
function clearDay(){if(!confirm('Reset today\'s session for this day?'))return;localStorage.removeItem(sessionKey(P[dayIdx].id));renderDay();}
function finishDay(){const day=P[dayIdx];const s=loadSess(day.id);const sets={};day.sections.forEach(sec=>sec.items.forEach(ex=>{sets[ex.id]=ex.sets.map((set,i)=>({kg:s[ex.id+'_kg_'+i]!==undefined?s[ex.id+'_kg_'+i]:set.kg,r:s[ex.id+'_r_'+i]!==undefined?s[ex.id+'_r_'+i]:set.r,done:s[ex.id+'_done_'+i]||false}));}));saveHist(day.id,{date:todayKey(),sets});let done=0,tot=0,vol=0;day.sections.forEach(sec=>sec.items.forEach(ex=>{ex.sets.forEach((set,i)=>{tot++;if(s[ex.id+'_done_'+i]){done++;const kg=s[ex.id+'_kg_'+i]!==undefined?s[ex.id+'_kg_'+i]:set.kg;const r=s[ex.id+'_r_'+i]!==undefined?s[ex.id+'_r_'+i]:set.r;vol+=kg*r;}});}));document.getElementById('exwrap').innerHTML='';document.getElementById('finish-area').style.display='none';const dw=document.getElementById('done-wrap');dw.classList.add('show');document.getElementById('done-sub').textContent=`${done} sets · ${Math.round(vol).toLocaleString('en-IN')} kg volume · Week ${weekNum()}`;}
function backFromDone(){renderDay();}
function openHistory(){const day=P[dayIdx];document.getElementById('hist-title').textContent=`${day.label} — History`;const hist=loadHist(day.id);const body=document.getElementById('hist-body');if(!hist.length){body.innerHTML='<p style="font-size:13px;color:var(--text3)">No sessions saved yet.</p>';}else{body.innerHTML=hist.map(h=>{const rows=Object.entries(h.sets||{}).map(([exId,sets])=>{let name=exId;for(const d of P)for(const s of d.sections)for(const e of s.items)if(e.id===exId)name=e.name;const done=sets.filter(s=>s.done).map(s=>`${s.kg}×${s.r}`).join('  ');return done?`<div>${name}: ${done}</div>`:''}).filter(Boolean).join('');return `<div class="h-entry"><div class="h-date">${h.date}</div><div class="h-sets">${rows||'No sets logged'}</div></div>`;}).join('');}document.getElementById('hist-modal').classList.add('show');}
function closeHistory(){document.getElementById('hist-modal').classList.remove('show');}
function maybeClose(e){if(e.target===document.getElementById('hist-modal'))closeHistory();}

document.getElementById('nav-date').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short',year:'numeric'});
buildTabs();
renderDay();
</script>
</body>
